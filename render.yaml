# Render Blueprint: deploys the backend API (Express + Socket.io) as a free
# web service. Render > New > Blueprint > pick this repo.
# Values marked `sync: false` are secrets: Render asks for them on first
# deploy (copy them from backend/.env). They are never stored in this file.
services:
  - type: web
    name: workspace-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci --omit=dev
    startCommand: node src/server.js
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      # Render terminates TLS in front of the app (one proxy hop).
      - key: TRUST_PROXY
        value: "1"
      # Frontend and API on different sites -> cross-site session cookie.
      - key: COOKIE_SAMESITE
        value: None
      - key: COOKIE_NAME
        value: sid
      - key: SESSION_TTL_DAYS
        value: "7"
      - key: MAX_UPLOAD_BYTES
        value: "26214400"
      - key: EMAIL_HOST
        value: smtp.gmail.com
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_SECURE
        value: "false"
      # Frontend origin(s), comma-separated, e.g.
      # https://your-app.vercel.app,http://localhost:3000
      - key: CLIENT_URL
        sync: false
      - key: MONGO_URI
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASSWORD
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
